name: Build, Push and Deploy to Azure Container App

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: passiontreeacr
  IMAGE_NAME: backend-app
  CONTAINER_APP_NAME: backend-go
  RESOURCE_GROUP: Passion-Tree

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Image
        run: |
          IMAGE_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build . -t $IMAGE_TAG
          docker push $IMAGE_TAG
          docker tag $IMAGE_TAG ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container App
        run: |
          APP_STATE=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query properties.provisioningState -o tsv 2>/dev/null)
          if [ "$APP_STATE" != "Succeeded" ]; then
            echo "Container App not ready (state: $APP_STATE) — skipping deploy"
            exit 0
          fi

          # Required secrets — must be set in GitHub Secrets
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "db-password=${{ secrets.AZURESQL_PASSWORD }}" \
              "storage-conn=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              "storage-key=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}" \
              "jwt-secret=${{ secrets.JWT_SECRET }}"

          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --set-env-vars \
              APP_ENV='production' \
              APP_URL='https://api.passion-tree.org' \
              AZURESQL_SERVER='${{ secrets.AZURESQL_SERVER }}' \
              AZURESQL_PORT='${{ secrets.AZURESQL_PORT }}' \
              AZURESQL_USER='${{ secrets.AZURESQL_USER }}' \
              AZURESQL_DATABASE='${{ secrets.AZURESQL_DATABASE }}' \
              AI_SERVICE_URL='http://passion-tree-ai-service' \
              AZURE_STORAGE_ACCOUNT_NAME='${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}' \
              CONTAINER_LEARNING_PATH='${{ secrets.CONTAINER_LEARNING_PATH }}' \
              CONTAINER_PROFILE='${{ secrets.CONTAINER_PROFILE }}' \
              JWT_ACCESS_TTL='${{ secrets.JWT_ACCESS_TTL }}' \
              JWT_REFRESH_TTL='${{ secrets.JWT_REFRESH_TTL }}' \
              JWT_REFRESH_ABSOLUTE='${{ secrets.JWT_REFRESH_ABSOLUTE }}' \
              GMAIL_EMAIL='${{ secrets.GMAIL_EMAIL }}' \
              GMAIL_APP_PASSWORD='${{ secrets.GMAIL_APP_PASSWORD }}' \
              GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
              GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
              GOOGLE_REDIRECT_URL='https://api.passion-tree.org/api/v1/auth/google/callback' \
              DISCORD_CLIENT_ID='${{ secrets.DISCORD_CLIENT_ID }}' \
              DISCORD_CLIENT_SECRET='${{ secrets.DISCORD_CLIENT_SECRET }}' \
              DISCORD_REDIRECT_URL='https://api.passion-tree.org/api/v1/auth/discord/callback' \
              DISCORD_NATIVE_REDIRECT_URL='https://api.passion-tree.org/api/v1/auth/discord/native/callback' \
              AZURESQL_PASSWORD='secretref:db-password' \
              AZURE_STORAGE_CONNECTION_STRING='secretref:storage-conn' \
              AZURE_STORAGE_ACCOUNT_KEY='secretref:storage-key' \
              JWT_SECRET='secretref:jwt-secret'
