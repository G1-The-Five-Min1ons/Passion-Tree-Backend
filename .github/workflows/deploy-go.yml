name: Build and Push to PassionTree ACR

on:
  push:
    branches: [ "main" ] # จะทำงานเมื่อมีการ push ขึ้น branch main

permissions:
  id-token: write # จำเป็นสำหรับการใช้ OIDC
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name passiontreecontainerregistry

      - name: Build and Push Image
        run: |
          # กำหนดชื่อ Image (เปลี่ยนชื่อ backend-app ได้ตามใจชอบ)
          IMAGE_TAG="passiontreecontainerregistry.azurecr.io/backend-app:${{ github.sha }}"
          
          docker build . -t $IMAGE_TAG
          docker push $IMAGE_TAG
          
          # แถม: Tag เป็น latest ด้วย
          docker tag $IMAGE_TAG passiontreecontainerregistry.azurecr.io/backend-app:latest
          docker push passiontreecontainerregistry.azurecr.io/backend-app:latest