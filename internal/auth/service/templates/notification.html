<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f7ff;font-family:Arial,'Segoe UI',sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7ff;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #dbeafe;box-shadow:0 8px 30px rgba(37,99,235,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 45%,#3b82f6 100%);padding:22px 24px;">
              <div style="font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#bfdbfe;font-weight:700;">Passion-Tree</div>
              <h1 style="margin:8px 0 0 0;font-size:22px;line-height:1.25;color:#ffffff;font-weight:700;">{{.Headline}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 24px 18px 24px;">
              <p style="margin:0;font-size:15px;line-height:1.7;color:#334155;white-space:pre-line;">{{.Message}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 24px 24px;">
              <a href="https://passion-tree.org" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;">Open Passion-Tree</a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px 20px 24px;background:#eff6ff;border-top:1px solid #dbeafe;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
                You are receiving this email because your notification settings are enabled in Passion-Tree.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
