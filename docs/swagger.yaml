      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      summary: Native Discord Sign-In (mobile)
