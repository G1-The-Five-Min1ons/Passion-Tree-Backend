      tags:
      - Auth
  /auth/discord:
    get:
      description: Returns a Discord authorization URL the client should redirect
        to.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.AuthURLResponse'
      summary: Initiate Discord OAuth2 login (web)
      tags:
      - Social Auth
  /auth/discord/callback:
    get:
      description: Exchanges the OAuth code for tokens and either logs the user in
        or returns a link-confirmation payload.
      parameters:
      - description: Authorization code from Discord
        in: query
        name: code
        required: true
        type: string
      - description: CSRF state echoed from /auth/discord
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.SuccessResponse'
        "300":
          description: Account linking confirmation required
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      summary: Discord OAuth2 callback (web)
      tags:
      - Social Auth
  /auth/discord/native/callback:
    get:
      description: Discord redirects here with ?code=...; this endpoint serves an
        HTML page that immediately redirects to the mobile app's custom URL scheme
        so flutter_web_auth_2 can capture the code.
      parameters:
      - description: Authorization code from Discord
        in: query
        name: code
        type: string
      - description: Error code from Discord
        in: query
        name: error
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML redirect page
          schema:
            type: string
      summary: Discord OAuth2 native bridge
      tags:
      - Social Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always returns 200 to avoid leaking whether an email exists in
