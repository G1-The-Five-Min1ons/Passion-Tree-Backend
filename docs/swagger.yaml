      parameters:
      - description: Email to send reset code to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      summary: Request password reset email
      tags:
      - Auth
  /auth/google:
    get:
      description: |-
        Returns a Google authorization URL the client should redirect to.
        Sets a CSRF state cookie that must be echoed back on callback.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.AuthURLResponse'
      summary: Initiate Google OAuth2 login (web)
      tags:
      - Social Auth
  /auth/google/callback:
    get:
      description: Exchanges the OAuth code for tokens and either logs the user in
        or returns a link-confirmation payload if the email already maps to another
        account.
      parameters:
      - description: Authorization code from Google
        in: query
        name: code
        required: true
        type: string
      - description: CSRF state echoed from /auth/google
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.SuccessResponse'
        "300":
          description: Account linking confirmation required
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      summary: Google OAuth2 callback (web)
      tags:
      - Social Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Logs in with username/email + password and returns access & refresh tokens.
        May also return `requires_otp` or `requires_reactivation` flags instead of tokens.
      parameters:
      - description: Set to 'true' to confirm reactivation of a deactivated account
        in: query
        name: confirm_reactivate
        type: string
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Account deactivated, awaiting reactivation confirmation
          schema:
            $ref: '#/definitions/apidoc.ReactivationRequiredResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "429":
          description: Too many login attempts
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      summary: Authenticate a user
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        If a refresh_token is provided in the body, only that session is revoked.
        Otherwise all refresh tokens for the user are revoked.
      parameters:
      - description: Optional specific refresh token to revoke
        in: body
        name: body
        schema:
          $ref: '#/definitions/model.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout (revoke refresh tokens)
      tags:
      - Auth
  /auth/native/discord:
    post:
      consumes:
      - application/json
