      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "401":
          description: Invalid ID token
