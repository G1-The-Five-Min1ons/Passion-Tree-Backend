      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidoc.UserIDResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apidoc.ErrorResponse'
      security:
      - BearerAuth: []
